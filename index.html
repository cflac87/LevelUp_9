<div id="root"></div>
<script>
const {
  useState,
  useMemo
} = React;

// ---------- Design tokens ----------
const C = {
  bg: "#1C2521",
  bgSoft: "#232E29",
  card: "#28332E",
  paper: "#F2EFE9",
  ink: "#EDEAE2",
  inkDim: "#A9B3AC",
  line: "#3A453F",
  good: "#8FA88C",
  goodDim: "#5F7660",
  bad: "#B5654A",
  badDim: "#7A4735",
  gold: "#C9A05C",
  amber: "#D0A24C",
  orange: "#C97C4A",
  red: "#B5544A",
  // Eigene, bewusst weiter auseinanderliegende Farben für die 4-stufige
  // Tagesbewertung im Kalender (statt gold/orange wiederzuverwenden, die
  // auf kleinen Punkten kaum unterscheidbar sind).
  statusGreat: "#7FB37A",
  statusGood: "#D4B24A",
  statusMixed: "#D97D3D",
  statusBad: "#C0453D"
};
const serif = "'Iowan Old Style', 'Palatino Linotype', Georgia, serif";
const sans = "'Inter', -apple-system, BlinkMacSystemFont, sans-serif";

// Vier Stufen statt drei: eine reine Gut/Schlecht-Einteilung würde die
// vielen Tage im mittleren Bereich verschlucken. "Durchwachsen" als eigene
// Zwischenstufe macht die Bewertung ehrlicher. Zentral definiert, damit
// ScoreDial, Kalender und Listenansicht garantiert dieselben Grenzen nutzen.
// Jede Stufe hat zusätzlich zur Farbe ein eigenes Symbol, damit die
// Kalender-Punkte auch bei ähnlicher Farbwahrnehmung unterscheidbar bleiben.
function dayStatus(total) {
  if (total >= 70) return {
    color: C.statusGreat,
    symbol: "●",
    label: "sehr guter Tag"
  };
  if (total >= 50) return {
    color: C.statusGood,
    symbol: "◆",
    label: "guter Tag"
  };
  if (total >= 25) return {
    color: C.statusMixed,
    symbol: "▲",
    label: "durchwachsener Tag"
  };
  return {
    color: C.statusBad,
    symbol: "■",
    label: "belasteter Tag"
  };
}
function dayStatusColor(total) {
  return dayStatus(total).color;
}

// =====================================================================
// AUFBAUPUNKTE (0–100) — Positivbereich, Summe der Maximalwerte = 100
// =====================================================================

// --- Schlaf: gestufte Auswahl statt Ja/Nein (max 22) ---
const SLEEP_LEVELS = [{
  key: "under6",
  label: "< 6 Std.",
  pts: 0
}, {
  key: "six",
  label: "6–7 Std.",
  pts: 12
}, {
  key: "seven",
  label: "7–8 Std.",
  pts: 18
}, {
  key: "eight",
  label: "8+ Std.",
  pts: 22
}];
// Gibt die Punkte zurück, oder null wenn gar nichts eingetragen wurde.
// Wichtig: "0 Punkte" (unter 6 Std., bewusst gewählt) und "nichts
// eingetragen" (null) sind unterschiedliche Zustände — Berichte müssen
// beide unterscheiden können, statt fehlende Einträge als 0 zu werten.
function sleepPoints(level) {
  if (!level) return null;
  return SLEEP_LEVELS.find(s => s.key === level)?.pts ?? null;
}
// Für Stellen, die unbedingt eine Zahl brauchen (z. B. Punktesumme des
// Tages) und "nicht eingetragen" wie 0 behandeln dürfen.
function sleepPointsOrZero(level) {
  return sleepPoints(level) ?? 0;
}

// --- Sport: Kraft + Ausdauer, je gestuft (max 12 + 12 = 24) ---
const SPORT_TYPES = [{
  key: "strength",
  label: "Kraftsport"
}, {
  key: "endurance",
  label: "Ausdauer / Bewegung"
}];
const SPORT_LEVELS = [{
  key: "none",
  label: "Kein Training",
  pts: 0
}, {
  key: "light",
  label: "Kurz / leicht",
  pts: 6
}, {
  key: "normal",
  label: "Normales Training",
  pts: 10
}, {
  key: "intense",
  label: "Lang / intensiv",
  pts: 12
}];
function sportPoints(sport) {
  let total = 0;
  for (const type of SPORT_TYPES) {
    const levelKey = sport?.[type.key] || "none";
    total += SPORT_LEVELS.find(l => l.key === levelKey)?.pts ?? 0;
  }
  return total;
}

// --- Ernährung: Sub-Kategorien (max 14: Obst/Gemüse 6, Eiweiß 5, Nüsse 1.5, Beeren 1.5) ---
const NUTRITION_ITEMS = [{
  key: "fruitVeg",
  label: "Obst / Gemüse",
  pts: 6
}, {
  key: "protein",
  label: "Eiweiß",
  pts: 5
}, {
  key: "nuts",
  label: "Nüsse",
  pts: 1.5
}, {
  key: "berries",
  label: "Beeren",
  pts: 1.5
}];
function nutritionCount(nutrition) {
  return NUTRITION_ITEMS.filter(n => nutrition?.includes(n.key)).length;
}
function nutritionPoints(nutrition) {
  return NUTRITION_ITEMS.filter(n => nutrition?.includes(n.key)).reduce((s, n) => s + n.pts, 0);
}

// --- übrige einfache Positiv-Kategorien ---
const SIMPLE_POSITIVE = [{
  key: "social",
  label: "Zeit mit Familie / Freunden",
  pts: 12,
  icon: "❤️"
}, {
  key: "meditation",
  label: "Meditation / bewusste Ruhe",
  pts: 10,
  icon: "🧘"
}, {
  key: "hydration",
  label: "Ausreichend Flüssigkeit",
  pts: 3,
  icon: "💧"
}, {
  key: "learning",
  label: "Lesen / Lernen",
  pts: 5,
  icon: "📚"
}, {
  key: "daylight",
  label: "Tageslicht / draußen",
  pts: 5,
  icon: "☀️"
}, {
  key: "reflection",
  label: "Heute kurz innegehalten / reflektiert / für etwas dankbar gewesen",
  pts: 3,
  icon: "🙏"
}, {
  key: "supplements",
  label: "Vitamine / Nahrungsergänzung genommen",
  pts: 2,
  icon: "💊"
}];
function simplePositivePoints(positive) {
  return SIMPLE_POSITIVE.filter(p => positive?.includes(p.key)).reduce((s, p) => s + p.pts, 0);
}

// Maximal erreichbar bei allem angehakt: 22 (Schlaf) + 24 (Sport) + 14 (Ernährung)
// + 12 (Sozial) + 10 (Meditation) + 3 (Flüssigkeit) + 5 (Lernen) + 5 (Tageslicht)
// + 3 (Reflexion) + 2 (Vitamine/NEMs) = 100
const MAX_BUILD_POINTS = 100;
function buildPoints(day) {
  const raw = sleepPointsOrZero(day.sleep) + sportPoints(day.sport) + nutritionPointsWithFasting(day) + simplePositivePoints(day.positive);
  return Math.round(Math.min(MAX_BUILD_POINTS, raw));
}

// --- Bonus-Hacks: echter Zuschlag ÜBER die 100 Aufbaupunkte hinaus, nicht
// Teil von buildPoints/MAX_BUILD_POINTS. Der Tageswert kann dadurch bewusst
// über 100 gehen, als spürbare Belohnung für zusätzliche Extra-Gewohnheiten. ---
const BONUS_HACKS = [{
  key: "coldshower",
  label: "Kaltduschen",
  pts: 3,
  icon: "🧊"
}, {
  key: "acupressure",
  label: "Akupressurmatte",
  pts: 3,
  icon: "🪡"
}, {
  key: "affirmations",
  label: "Affirmationen",
  pts: 3,
  icon: "🗣️"
}];
function bonusHackPoints(bonus) {
  return BONUS_HACKS.filter(b => bonus?.includes(b.key)).reduce((s, b) => s + b.pts, 0);
}

// --- Fasten: eigener Bonus-Hack mit 3 Stufen (kein einfacher Ja/Nein-Toggle
// wie die anderen drei), da bei 24h+ die normale Ernährungskomponente durch
// den Fastentag ersetzt wird, statt zusätzlich Punkte zu geben. Das
// verhindert eine Doppelbelohnung (Fasten + volle Ernährungspunkte gleichzeitig).
const FASTING_OPTIONS = [{
  key: "under12",
  label: "Unter 12 Std."
}, {
  key: "12to24",
  label: "12–24 Std."
}, {
  key: "over24",
  label: "24+ Std."
}];
function fastingBonusPoints(fasting) {
  if (fasting === "12to24" || fasting === "over24") return 3;
  return 0;
}
// Bei 24h+ Fasten gilt die Ernährungskomponente als durch den Fastentag
// ersetzt: pauschal 14 Punkte (= Maximum der vier Ernährungskategorien),
// statt die tatsächlich angehakten Ernährungsitems zu zählen. Das verhindert,
// dass ein 24h-Fastentag fälschlich als "schlechte Ernährung" (0 Punkte)
// erscheint UND verhindert gleichzeitig, dass zusätzlich echte
// Ernährungspunkte oben draufgezählt werden (keine Doppelzählung).
function nutritionPointsWithFasting(day) {
  if (day.fasting === "over24") return 14;
  return nutritionPoints(day.nutrition);
}

// =====================================================================
// BELASTUNGSPUNKTE — Alkohol, separat, 0 bis −40, gedeckelt
// =====================================================================

// Getränkeauswahl: feste Mengen-Stufen statt freier ml/Vol.%-Eingabe.
// Die letzte Stufe rechnet mit 4 Einheiten; der Text macht deutlich, dass
// noch größere Mengen die Belastung weiter erhöhen.
const BEER_OPTIONS = [{
  key: "0",
  count: 0,
  label: "Kein Bier"
}, {
  key: "1",
  count: 1,
  label: "1 × 0,5 l"
}, {
  key: "2",
  count: 2,
  label: "2 × 0,5 l"
}, {
  key: "3",
  count: 3,
  label: "3 × 0,5 l"
}, {
  key: "4",
  count: 4,
  label: "Mehr als 3 × 0,5 l"
}];
const WINE_OPTIONS = [{
  key: "0",
  count: 0,
  label: "Kein Wein"
}, {
  key: "1",
  count: 1,
  label: "1 Glas"
}, {
  key: "2",
  count: 2,
  label: "2 Gläser"
}, {
  key: "3",
  count: 3,
  label: "3 Gläser"
}, {
  key: "4",
  count: 4,
  label: "Mehr als 3"
}];
const BEER_ML = 500;
const BEER_VOL = 0.05;
const WINE_ML = 200;
const WINE_VOL = 0.12;
const ETHANOL_DENSITY = 0.8;
function alcoholGrams(alcohol) {
  const beerCount = BEER_OPTIONS.find(o => o.key === alcohol?.beer)?.count ?? 0;
  const wineCount = WINE_OPTIONS.find(o => o.key === alcohol?.wine)?.count ?? 0;
  const beerGrams = beerCount * BEER_ML * BEER_VOL * ETHANOL_DENSITY;
  const wineGrams = wineCount * WINE_ML * WINE_VOL * ETHANOL_DENSITY;
  return Math.round(beerGrams + wineGrams);
}

// Zeigt an, ob die höchste Auswahlstufe getroffen wurde ("mehr als 3") —
// dann macht der Text zusätzlich deutlich, dass es bei noch größeren
// Mengen weiter ansteigt, auch wenn der Abzug selbst gedeckelt ist.
function isTopTier(alcohol) {
  return alcohol?.beer === "4" || alcohol?.wine === "4";
}
function alcoholLevel(grams) {
  if (grams <= 0) return {
    key: "none",
    label: "Keine Belastung",
    dot: "🟢",
    color: C.good,
    deduction: 0
  };
  if (grams <= 24) return {
    key: "light",
    label: "Leichte Belastung",
    dot: "🟡",
    color: C.amber,
    deduction: -5
  };
  if (grams <= 40) return {
    key: "medium",
    label: "Mittlere Belastung",
    dot: "🟠",
    color: C.orange,
    deduction: -10
  };
  if (grams <= 60) return {
    key: "elevated",
    label: "Erhöhte Belastung",
    dot: "🟠",
    color: C.orange,
    deduction: -20
  };
  return {
    key: "high",
    label: "Hohe Belastung",
    dot: "🔴",
    color: C.red,
    deduction: -40
  };
}
function alcoholText(grams, topTier) {
  if (grams <= 0) return "Du hattest heute keinen Alkohol.";
  if (grams <= 24) return "Deine eingetragene Menge lag heute im niedrigen Belastungsbereich des App-Modells. Beobachte, wie du dich morgen fühlst.";
  if (grams <= 40) return "Deine eingetragene Menge lag heute im mittleren Belastungsbereich des App-Modells. Alkohol kann Schlaf und Erholung beeinträchtigen – beobachte in deinem eigenen Verlauf, ob du am Folgetag Unterschiede bemerkst.";
  if (grams <= 60) return "Deine eingetragene Menge war heute deutlich erhöht. Das kann Schlaf, Erholung und Konzentration stärker beeinträchtigen.";
  const moreNote = topTier ? " War es heute deutlich mehr, gilt: je größer die Menge, desto stärker die Belastung – auch wenn der Punkteabzug hier nicht weiter steigt." : "";
  return `Deine eingetragene Menge war heute hoch, deshalb bleibt der Abzug bei −40 Punkten.${moreNote} Alkohol kann Schlaf, Erholung und Stimmung beeinträchtigen. Dein bisheriger Verlauf bleibt trotzdem bestehen – ein einzelner Tag verändert ihn nicht.`;
}

// =====================================================================
// Rauchen (auch gelegentlicher Konsum, z. B. Joints) — gestufte Auswahl
// statt einfachem Ja/Nein, analog zu Bildschirmzeit/Zucker.
// =====================================================================
const SMOKING_OPTIONS = [{
  key: "none",
  label: "Kein"
}, {
  key: "little",
  label: "Wenig"
}, {
  key: "much",
  label: "Viel"
}];
function smokingLevel(key) {
  if (!key || key === "none") return {
    key: "none",
    label: "Kein Rauchen",
    dot: "🟢",
    color: C.good,
    deduction: 0
  };
  if (key === "little") return {
    key: "little",
    label: "Wenig geraucht",
    dot: "🟡",
    color: C.amber,
    deduction: -5
  };
  return {
    key: "much",
    label: "Viel geraucht",
    dot: "🔴",
    color: C.red,
    deduction: -15
  };
}
function smokingDeduction(day) {
  return smokingLevel(day.smoking).deduction;
}

// =====================================================================
// Bildschirmzeit — separates Belastungsmodul, analog zu Alkohol: gestufte
// Auswahl (keine Minuten-Erfassung), Ampel-Logik, gedeckelter Abzug.
// Bezieht sich auf private/freie Bildschirmzeit (Handy/Streaming/Social
// Media), nicht auf beruflich notwendige Bildschirmarbeit.
// =====================================================================
const SCREENTIME_OPTIONS = [{
  key: "low",
  label: "Unter 2 Std.",
  hours: 1
}, {
  key: "medium",
  label: "2–4 Std.",
  hours: 3
}, {
  key: "high",
  label: "4–6 Std.",
  hours: 5
}, {
  key: "veryhigh",
  label: "Mehr als 6 Std.",
  hours: 7
}];
function screentimeLevel(key) {
  if (!key || key === "low") return {
    key: "low",
    label: "Geringe Belastung",
    dot: "🟢",
    color: C.good,
    deduction: 0
  };
  if (key === "medium") return {
    key: "medium",
    label: "Leichte Belastung",
    dot: "🟡",
    color: C.amber,
    deduction: -5
  };
  if (key === "high") return {
    key: "high",
    label: "Erhöhte Belastung",
    dot: "🟠",
    color: C.orange,
    deduction: -12
  };
  return {
    key: "veryhigh",
    label: "Hohe Belastung",
    dot: "🔴",
    color: C.red,
    deduction: -20
  };
}
function screentimeText(key) {
  if (!key || key === "low") return "Deine private Bildschirmzeit war heute gering.";
  if (key === "medium") return "Deine private Bildschirmzeit war heute moderat. Bei Nutzung am späten Abend kann das Einschlafen schwerer fallen – beobachte, ob du das bei dir bemerkst.";
  if (key === "high") return "Deine private Bildschirmzeit war heute deutlich erhöht – besonders bei Nutzung kurz vor dem Schlafengehen kann das Einschlafen erschweren.";
  return "Deine private Bildschirmzeit war heute sehr hoch. Reine Beobachtung, kein Werturteil – dein bisheriger Verlauf bleibt bestehen.";
}

// =====================================================================
// Zucker — separates Belastungsmodul, analog zu Bildschirmzeit: gestufte
// Auswahl statt Gramm-Erfassung, Ampel-Logik, moderater gedeckelter Abzug.
// =====================================================================
const SUGAR_OPTIONS = [{
  key: "low",
  label: "Kaum / kein Zucker"
}, {
  key: "some",
  label: "Etwas (z. B. 1 Süßigkeit)"
}, {
  key: "much",
  label: "Deutlich (mehrere Süßigkeiten, Limo)"
}, {
  key: "verymuch",
  label: "Sehr viel (durchgehend Süßes)"
}];
function sugarLevel(key) {
  if (!key || key === "low") return {
    key: "low",
    label: "Geringe Belastung",
    dot: "🟢",
    color: C.good,
    deduction: 0
  };
  if (key === "some") return {
    key: "some",
    label: "Leichte Belastung",
    dot: "🟡",
    color: C.amber,
    deduction: -5
  };
  if (key === "much") return {
    key: "much",
    label: "Erhöhte Belastung",
    dot: "🟠",
    color: C.orange,
    deduction: -10
  };
  return {
    key: "verymuch",
    label: "Hohe Belastung",
    dot: "🔴",
    color: C.red,
    deduction: -15
  };
}
function sugarText(key) {
  if (!key || key === "low") return "Du hattest heute kaum oder keinen zugesetzten Zucker.";
  if (key === "some") return "Etwas Zucker heute. Beobachte, ob du das bei deinem Energielevel im Tagesverlauf bemerkst.";
  if (key === "much") return "Deutlich mehr Zucker heute. Das wird häufig mit kurzfristigen Energietiefs in Verbindung gebracht – beobachte, ob du das bei dir bemerkst.";
  return "Heute war die Zuckermenge sehr hoch. Reine Beobachtung, kein Werturteil – dein bisheriger Verlauf bleibt bestehen.";
}
function scoreDay(day) {
  const build = buildPoints(day);
  const grams = alcoholGrams(day.alcohol);
  const level = alcoholLevel(grams);
  const smokingPts = smokingDeduction(day);
  const screenLevel = screentimeLevel(day.screentime);
  const sugarLvl = sugarLevel(day.sugar);
  const bonus = bonusHackPoints(day.bonus);
  const fastingBonus = fastingBonusPoints(day.fasting);
  // Obere Deckelung bewusst entfernt: Bonus-Hacks dürfen den Tageswert
  // über 100 heben, als echter Zuschlag statt Teil der 100 Aufbaupunkte.
  const total = Math.max(0, build + level.deduction + smokingPts + screenLevel.deduction + sugarLvl.deduction + bonus + fastingBonus);
  return {
    build,
    alcoholGrams: grams,
    alcoholLevel: level,
    smokingDeduction: smokingPts,
    screentimeLevel: screenLevel,
    sugarLevel: sugarLvl,
    bonus,
    fastingBonus,
    total
  };
}

// =====================================================================

// Kategorie trägt anteilig zu allen drei Bereichen bei. "Energie" steht
// dabei nicht für einen medizinischen Messwert, sondern für Erholung,
// Vitalität und subjektives Energiegefühl im Sinne dieses Modells.
// =====================================================================
// Gewichte je Kategorie, wie sich ihre Punkte auf Körper/Geist/Energie
// verteilen. Bewusst so kalibriert, dass die drei Bereiche insgesamt
// ungefähr gleich schwer zu füllen sind (jeweils ~35–39 von ~112

// weil ihr zu wenige Kategorien nennenswert zuarbeiteten (z. B. "Lernen"

  },

  },

  },

  },

  },

  },

  },

  label: "Schlafqualität",

}, {

},
// Diese vier Ergebnisgrößen werden selbst aus den Faktoren berechnet
// (Punktesystem). "Faktor → Tagesgesamtpunktzahl" am selben Tag wäre
// daher zirkulär — der Faktor verändert ja per Definition genau diesen
// Wert (z. B. Alkohol zieht Punkte ab, also ist die Punktzahl an
// Alkohol-Tagen niedriger — das "entdeckt" nur die eigene Scoring-Regel
// neu, ist kein unabhängiges persönliches Muster). Same-Day-Vergleiche
// mit diesen vier Größen werden deshalb unterdrückt (siehe
// isCircularSameDay unten); Next-Day bleibt zulässig, da der morgige
// Score nicht vom heutigen Faktor mitbestimmt wird.
{
  key: "total",
  label: "Tagesgesamtpunktzahl",
  value: d => scoreDay(d).total,
  scoreDerived: true
}, {

  scoreDerived: true
}];

// Same-Day-Vergleiche zwischen einem punktrelevanten Faktor und einer aus
// dem Punktesystem abgeleiteten Ergebnisgröße sind zirkulär (siehe oben).
// Rein subjektive Faktoren (Meditation, soziale Zeit, ...) beeinflussen die
// Tagesgesamtpunktzahl zwar auch, aber weniger unmittelbar tautologisch als
// z. B. "Alkohol → Alkoholabzug in der Punktzahl" — trotzdem gilt die Regel
// einheitlich für alle Faktoren, um konsistent zu bleiben und echte
// Doppelinterpretation zu vermeiden.
function isCircularSameDay(factor, outcome) {
  return !!outcome.scoreDerived;
}

// Same-Day: Faktor am Tag X, Ergebnis am selben Tag X.
function genericCorrelationSameDay(days, factor, outcome) {
  const withF = [];
  const withoutF = [];
  for (const d of days) {
    // Faktoren mit gestuften Werten (Alkohol, Bildschirmzeit, ...) können
    // "nicht eingetragen" sein — das darf nicht wie "nicht erfüllt" in die
    // Vergleichsgruppe einfließen (Punkt 13/14/44 der Anleitung).
    if (factor.answered && !factor.answered(d)) continue;
    const val = outcome.value(d);
    if (val === null || val === undefined) continue;
    if (factor.test(d)) withF.push(val);else withoutF.push(val);
  }
  const avg = arr => arr.length > 0 ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
  return {
    factor: factor.label,
    outcome: outcome.label,
    timing: "same-day",
    with: avg(withF),
    without: avg(withoutF),
    withCount: withF.length,
    withoutCount: withoutF.length
  };
}

// Next-Day: Faktor am Tag X, Ergebnis am Tag X+1 — nur wenn X+1 wirklich
// der nächste echte Kalendertag ist (keine Datenlücke dazwischen).
function genericCorrelationNextDay(days, factor, outcome) {
  const withF = [];
  const withoutF = [];
  for (let i = 0; i < days.length - 1; i++) {
    const today = days[i];
    const tomorrow = days[i + 1];
    if (daysBetween(today.date, tomorrow.date) !== 1) continue;
    if (factor.answered && !factor.answered(today)) continue;
    const val = outcome.value(tomorrow);
    if (val === null || val === undefined) continue;
    if (factor.test(today)) withF.push(val);else withoutF.push(val);
  }
  const avg = arr => arr.length > 0 ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
  return {
    factor: factor.label,
    outcome: outcome.label,
    timing: "next-day",
    with: avg(withF),
    without: avg(withoutF),
    withCount: withF.length,
    withoutCount: withoutF.length
  };
}

// Mindestdatenmengen-Stufen (Punkt 16/48 der Anleitung): unter 7
// Vergleichstagen je Gruppe kein Muster, sonst gestufte Konfidenz.
function patternConfidence(withCount, withoutCount) {
  const minCount = Math.min(withCount, withoutCount);
  if (minCount < 3) return null; // zu wenig für irgendeine Aussage
  if (withCount < 7 && withoutCount < 7) return "erste Beobachtung";
  if (withCount < 14 || withoutCount < 14) return "erste Beobachtung";
  if (withCount < 30 && withoutCount < 30) return "deutliches persönliches Muster";
  return "langfristig beobachtetes Muster";
}

// Prüft, ob eine gefundene Korrelation groß und gut belegt genug ist, um
// als Muster zu gelten (nicht jede kleine Schwankung ist ein "Muster").
function isSignificantCorrelation(result, minDiff) {
  if (result.with === null || result.without === null) return false;
  if (result.withCount < 3 || result.withoutCount < 3) return false;
  const diff = Math.abs(result.with - result.without);
  return diff >= minDiff;
}

// Baut aus einer generischen Korrelation einen fertigen, lesbaren
// Bericht-Eintrag im "In deinen Einträgen zeigt sich..."-Stil, ohne
// Kausalitätsbehauptung.
function formatCorrelationReport(result) {
  const conf = patternConfidence(result.withCount, result.withoutCount);
  const timingText = result.timing === "next-day" ? " am Folgetag" : "";
  const outcomeLabel = result.outcome === "Tagesgesamtpunktzahl" ? "deine Punktzahl" : "dein Wert für " + result.outcome;
  // "70+ Punkte-Tage" ist ein Plural-Substantiv, kein Verhalten wie
  // "Alkohol" oder "Meditation" — deshalb eigene Satzform statt "An Tagen mit".
  const factorPhrase = result.factor === "70+ Punkte-Tage" ? "An 70+ Punkte-Tagen" + timingText : `An Tagen mit ${result.factor}${timingText}`;
  const confText = conf ? ` (${conf})` : "";
  return {
    title: `${result.factor} → ${result.outcome}${timingText}`,
    text: `${factorPhrase} lag ${outcomeLabel} im Schnitt bei ${result.with.toFixed(1)}, an Vergleichstagen ohne bei ${result.without.toFixed(1)} (${result.withCount} vs. ${result.withoutCount} Tage)${confText}. Das ist eine persönliche Beobachtung, kein Beweis für eine Ursache.`,
    confidence: conf,
    diff: result.with - result.without,
    withCount: result.withCount,
    withoutCount: result.withoutCount
  };
}

// Durchsucht alle sinnvollen Faktor×Ergebnis-Kombinationen (same-day und
// next-day) und liefert nur die statistisch tragfähigen zurück, sortiert
// nach Bedeutsamkeit (größter, am besten belegter Unterschied zuerst).
// "Intern breit analysieren, extern schlank darstellen": die Funktion
// prüft viele Kombinationen, gibt aber nur die relevanten zurück.
function runPatternEngine(days) {
  const results = [];
  for (const factor of PATTERN_FACTORS) {
    for (const outcome of PATTERN_OUTCOMES) {
      const scoreDerivedThreshold = outcome.scoreDerived ? 5 : 0.5;
      // Same-Day für punktrelevante Ergebnisgrößen (Tagesgesamtpunktzahl,
      // Körper, Geist, Energie-Bereich) wäre zirkulär — der Faktor selbst
      // bestimmt diesen Wert mit, siehe isCircularSameDay.
      if (!isCircularSameDay(factor, outcome)) {
        const same = genericCorrelationSameDay(days, factor, outcome);
        if (isSignificantCorrelation(same, scoreDerivedThreshold)) {
          results.push(same);
        }
      }
      const next = genericCorrelationNextDay(days, factor, outcome);
      if (isSignificantCorrelation(next, scoreDerivedThreshold)) {
        results.push(next);
      }
    }
  }
  // Sortierung nach Bedeutsamkeit: mehr Gesamtdaten und größerer
  // Unterschied zuerst, damit "Top-Muster" wirklich die relevantesten sind.
  results.sort((a, b) => {
    const scoreA = Math.abs(a.with - a.without) * Math.log(a.withCount + a.withoutCount + 1);
    const scoreB = Math.abs(b.with - b.without) * Math.log(b.withCount + b.withoutCount + 1);
    return scoreB - scoreA;
  });
  return results.map(formatCorrelationReport);
}

// Kurzer, warmer "Spiegel"-Satz für die Heute-Ansicht, gespeist aus dem
// stärksten aktuell verfügbaren Muster (Engine-Ergebnisse + bestehende
// Kombinationsanalyse). Bewusst kürzer und persönlicher formuliert als die
// nüchternen Berichte-Texte — für die tägliche Ansicht reicht ein Satz,
// nicht die volle Zahlen-Aufschlüsselung. Gibt null zurück, wenn (noch)
// kein tragfähiges Muster vorliegt — dann zeigt die Heute-Ansicht einfach
// nichts an, statt eine erfundene Aussage zu zeigen.
function dailyMirrorInsight(history) {
  if (history.length < 7) return null;

  // Nur Muster mit den subjektiven Feeling-Werten als Ergebnisgröße nutzen
  // (Energie, Stimmung, Stress, Schlafqualität) — das sind die persönlich
  // am leichtesten nachvollziehbaren, im Gegensatz zu z. B. "Alkohol wirkt
  // sich auf den Körper-Bereich aus", was für einen einzelnen kurzen Satz
  // auf der Heute-Ansicht zu abstrakt und leicht missverständlich wäre.
  const feelingOutcomeLabels = ["Energie", "Stimmung", "Stress", "Schlafqualität"];
  const engineResults = runPatternEngine(history).filter(r => {
    const outcomePart = r.title.split(" → ")[1]?.replace(" am Folgetag", "");
    return feelingOutcomeLabels.includes(outcomePart);
  });
  const combos = analyzeCombos(history).filter(c => c.avgNonMatch !== null && Math.abs(c.diff) >= 5);

  // Beide Quellen (Einzelfaktoren und Kombinationen) vergleichbar machen:
  // grobe Bedeutsamkeit aus Differenz × Datenmenge, wie in runPatternEngine.
  const candidates = [];
  if (engineResults.length > 0) {
    const top = engineResults[0]; // bereits nach Bedeutsamkeit sortiert
    const [factorPart, outcomePartRaw] = top.title.split(" → ");
    const outcomePart = outcomePartRaw.replace(" am Folgetag", "");
    const isNextDay = top.title.includes("am Folgetag");
    const direction = top.diff >= 0 ? "höher" : "niedriger";
    candidates.push({
      weight: Math.abs(top.diff) * Math.log((top.withCount || 0) + (top.withoutCount || 0) + 1),
      text: `An Tagen${isNextDay ? " nach " + factorPart : " mit " + factorPart} liegt deine ${outcomePart} bisher im Schnitt ${direction} als sonst.`
    });
  }
  if (combos.length > 0) {
    const bestCombo = combos.reduce((a, b) => Math.abs(b.diff) > Math.abs(a.diff) ? b : a);
    candidates.push({
      weight: Math.abs(bestCombo.diff) * Math.log(bestCombo.count + 1),
      text: `Deine stärksten Tage entstehen bisher vor allem, wenn du "${bestCombo.label}" kombinierst.`
    });
  }
  if (candidates.length === 0) return null;
  candidates.sort((a, b) => b.weight - a.weight);
  return candidates[0].text;
}
function analyzeCombos(days) {
  return COMBO_DEFINITIONS.map(combo => {
    const matching = days.filter(combo.test);
    const nonMatching = days.filter(d => !combo.test(d));
    if (matching.length < MIN_COMBO_DAYS) return null;
    const avgMatch = Math.round(matching.reduce((s, d) => s + scoreDay(d).total, 0) / matching.length);
    const avgNonMatch = nonMatching.length > 0 ? Math.round(nonMatching.reduce((s, d) => s + scoreDay(d).total, 0) / nonMatching.length) : null;
    const diff = avgNonMatch !== null ? avgMatch - avgNonMatch : null;
    return {
      ...combo,
      count: matching.length,
      avgMatch,
      avgNonMatch,
      diff,
      confidence: confidenceLabel(matching.length)
    };
  }).filter(Boolean);
}
function analyzeRange(days) {
  const scored = days.map(d => ({
    day: d,
    score: scoreDay(d)
  }));
  const best = scored.reduce((a, b) => b.score.total > a.score.total ? b : a, scored[0]);
  const worst = scored.reduce((a, b) => b.score.total < a.score.total ? b : a, scored[0]);
  const avg = Math.round(scored.reduce((s, x) => s + x.score.total, 0) / scored.length);
  const alcoholFreeDays = scored.filter(x => x.score.alcoholGrams === 0).length;
  const alcoholFreeStreak = currentStreak(days, d => alcoholGrams(d.alcohol) === 0);
  const longestAlcoholFreeStreak = longestStreak(days, d => alcoholGrams(d.alcohol) === 0);
  const highAlcoholDays = scored.filter(x => x.score.alcoholLevel.key === "high").length;
  // "Häufig, aber gering" – z. B. regelmäßig 1 Bier, ohne dass ein einzelner
  // Tag je als "hoch" auffällt. Zählt jeden Tag mit Alkohol > 0g, unabhängig
  // von der Stufe.
  const anyAlcoholDays = scored.filter(x => x.score.alcoholGrams > 0).length;
  const anyAlcoholShare = anyAlcoholDays / days.length;
  const goodSleepDays = days.filter(d => d.sleep === "eight" || d.sleep === "seven").length;
  const lowSleepDays = days.filter(d => d.sleep === "under6").length;
  const sleepStreak = currentStreak(days, d => d.sleep === "eight" || d.sleep === "seven");
  const lowSleepShare = lowSleepDays / days.length;
  const strengthCount = days.filter(d => d.sport?.strength && d.sport.strength !== "none").length;
  const enduranceCount = days.filter(d => d.sport?.endurance && d.sport.endurance !== "none").length;
  const intenseSportCount = days.filter(d => d.sport?.strength === "intense" || d.sport?.endurance === "intense").length;
  // "Kein Sport" zählt nur Tage, an denen explizit "Kein Training" gewählt
  // wurde — nicht Tage, an denen die Sport-Frage schlicht nicht beantwortet
  // wurde (dort ist strength/endurance null, nicht "none").
  const noSportDays = days.filter(d => d.sport?.strength === "none" && d.sport?.endurance === "none").length;
  const noSportStreak = currentStreak(days, d => d.sport?.strength === "none" && d.sport?.endurance === "none");
  const sportAnsweredDays = days.filter(d => d.sport?.strength != null && d.sport?.endurance != null).length;
  const noSportShare = sportAnsweredDays > 0 ? noSportDays / sportAnsweredDays : 0;
  const goodNutritionDays = days.filter(d => nutritionCount(d.nutrition) >= 2).length;
  const supplementDays = days.filter(d => d.positive?.includes("supplements")).length;
  const socialDays = days.filter(d => d.positive.includes("social")).length;
  const meditationDays = days.filter(d => d.positive.includes("meditation")).length;
  const reflectionDays = days.filter(d => d.positive?.includes("reflection")).length;

  // Bildschirmzeit/Zucker: nur Tage werten, an denen tatsächlich eine
  // Angabe gemacht wurde (nicht null) — sonst würde "nicht beantwortet"
  // fälschlich als "geringe Belastung" in die Statistik einfließen.
  const screentimeAnsweredDays = days.filter(d => d.screentime != null);
  const highScreentimeDays = screentimeAnsweredDays.filter(d => screentimeLevel(d.screentime).key === "veryhigh").length;
  const anyElevatedScreentimeDays = screentimeAnsweredDays.filter(d => screentimeLevel(d.screentime).deduction < 0).length;
  const elevatedScreentimeShare = screentimeAnsweredDays.length > 0 ? anyElevatedScreentimeDays / screentimeAnsweredDays.length : 0;
  const highScreentimeStreak = currentStreak(days, d => d.screentime != null && screentimeLevel(d.screentime).deduction < 0);
  const sugarAnsweredDays = days.filter(d => d.sugar != null);
  const highSugarDays = sugarAnsweredDays.filter(d => sugarLevel(d.sugar).key === "verymuch").length;
  const anyElevatedSugarDays = sugarAnsweredDays.filter(d => sugarLevel(d.sugar).deduction < 0).length;
  const elevatedSugarShare = sugarAnsweredDays.length > 0 ? anyElevatedSugarDays / sugarAnsweredDays.length : 0;
  const highSugarStreak = currentStreak(days, d => d.sugar != null && sugarLevel(d.sugar).deduction < 0);
  const smokingAnsweredDays = days.filter(d => d.smoking != null);
  const highSmokingDays = smokingAnsweredDays.filter(d => smokingLevel(d.smoking).key === "much").length;
  const anySmokingDays = smokingAnsweredDays.filter(d => smokingLevel(d.smoking).deduction < 0).length;
  const smokingShare = smokingAnsweredDays.length > 0 ? anySmokingDays / smokingAnsweredDays.length : 0;
  const smokingStreak = currentStreak(days, d => d.smoking != null && smokingLevel(d.smoking).deduction < 0);

  // Generischer Vortag→Folgetag-Vergleich für den objektiven Schlafwert:
  // prüft, ob am nächsten echten Kalendertag ein Schlafeintrag vorliegt,
  // je nachdem ob am Vortag ein Zustand erfüllt war oder nicht.
  function sleepAfterCondition(conditionFn) {
    let withCondition = [];
    let withoutCondition = [];
    for (let i = 0; i < days.length - 1; i++) {
      const today = days[i];
      const tomorrow = days[i + 1];
      if (daysBetween(today.date, tomorrow.date) !== 1) continue;
      const sleepScore = sleepPoints(tomorrow.sleep);
      if (sleepScore === null) continue;
      if (conditionFn(today)) withCondition.push(sleepScore);else withoutCondition.push(sleepScore);
    }
    const avg = arr => arr.length > 0 ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
    return {
      with: avg(withCondition),
      without: avg(withoutCondition),
      withCount: withCondition.length,
      withoutCount: withoutCondition.length
    };
  }
  const sleepAfterAlcoholRes = sleepAfterCondition(d => alcoholGrams(d.alcohol) > 0);
  const avgSleepAfterAlcohol = sleepAfterAlcoholRes.with;
  const avgSleepAfterNoAlcohol = sleepAfterAlcoholRes.without;
  const sleepAfterScreenRes = sleepAfterCondition(d => screentimeLevel(d.screentime).deduction < 0);
  const avgSleepAfterHighScreen = sleepAfterScreenRes.with;
  const avgSleepAfterLowScreen = sleepAfterScreenRes.without;
  const sleepAfterSugarRes = sleepAfterCondition(d => sugarLevel(d.sugar).deduction < 0);
  const avgSleepAfterHighSugar = sleepAfterSugarRes.with;
  const avgSleepAfterLowSugar = sleepAfterSugarRes.without;
  const sleepAfterSmokingRes = sleepAfterCondition(d => smokingLevel(d.smoking).deduction < 0);
  const avgSleepAfterSmoking = sleepAfterSmokingRes.with;
  const avgSleepAfterNoSmoking = sleepAfterSmokingRes.without;

  // Generischer Vortag→Folgetag-Vergleich: prüft einen Feeling-Wert (Energie/
  // Stimmung/Stress/Schlafqualität) am jeweils nächsten echten Kalendertag,
  // je nachdem ob am Vortag ein Zustand erfüllt war oder nicht.
  function feelingAfterCondition(conditionFn, feelingKey) {
    let withCondition = [];
    let withoutCondition = [];
    for (let i = 0; i < days.length - 1; i++) {
      const today = days[i];
      const tomorrow = days[i + 1];
      if (daysBetween(today.date, tomorrow.date) !== 1) continue;
      const val = feelingAvg(tomorrow, feelingKey);
      if (val === null) continue;
      if (conditionFn(today)) withCondition.push(val);else withoutCondition.push(val);
    }
    const avg = arr => arr.length > 0 ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
    return {
      with: avg(withCondition),
      without: avg(withoutCondition),
      withCount: withCondition.length,
      withoutCount: withoutCondition.length
    };
  }

  // Alkohol, Bildschirmzeit, Zucker, Rauchen am Vortag -> eigene Einschätzung
  // (Energie, Stimmung) am Folgetag — konsistent für alle vier Belastungen.
  const moodAfterAlcohol = feelingAfterCondition(d => alcoholGrams(d.alcohol) > 0, "mood");
  const energyAfterAlcohol = feelingAfterCondition(d => alcoholGrams(d.alcohol) > 0, "energy");
  const moodAfterScreen = feelingAfterCondition(d => screentimeLevel(d.screentime).deduction < 0, "mood");
  const energyAfterScreen = feelingAfterCondition(d => screentimeLevel(d.screentime).deduction < 0, "energy");
  const moodAfterSugar = feelingAfterCondition(d => sugarLevel(d.sugar).deduction < 0, "mood");
  const energyAfterSugar = feelingAfterCondition(d => sugarLevel(d.sugar).deduction < 0, "energy");
  const moodAfterSmoking = feelingAfterCondition(d => smokingLevel(d.smoking).deduction < 0, "mood");
  const energyAfterSmoking = feelingAfterCondition(d => smokingLevel(d.smoking).deduction < 0, "energy");

  // Bonus-Hacks am selben Tag -> eigene Energie-/Stimmungs-Einschätzung
  // desselben Tages (macht hier mehr Sinn als "am Folgetag", da z. B.
  // Kaltduschen direkt am selben Morgen wirken soll, nicht erst am Tag danach).
  function feelingSameDayWithBonus(bonusKey, feelingKey) {
    let withHack = [];
    let withoutHack = [];
    for (const d of days) {
      const val = feelingAvg(d, feelingKey);
      if (val === null) continue;
      if ((d.bonus || []).includes(bonusKey)) withHack.push(val);else withoutHack.push(val);
    }
    const avg = arr => arr.length > 0 ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
    return {
      with: avg(withHack),
      without: avg(withoutHack),
      withCount: withHack.length,
      withoutCount: withoutHack.length
    };
  }
  const energyWithColdShower = feelingSameDayWithBonus("coldshower", "energy");
  const energyWithAcupressure = feelingSameDayWithBonus("acupressure", "energy");
  const moodWithAffirmations = feelingSameDayWithBonus("affirmations", "mood");

  // Wochentag-Muster: durchschnittlicher Score je Wochentag (nur wenn min. 2 Datenpunkte pro Tag)
  const byWeekday = {};
  scored.forEach(({
    day,
    score
  }) => {
    const wd = weekdayOf(day.date);
    if (!byWeekday[wd]) byWeekday[wd] = [];
    byWeekday[wd].push(score.total);
  });
  const weekdayAverages = Object.entries(byWeekday).filter(([, vals]) => vals.length >= 2).map(([wd, vals]) => ({
    weekday: wd,
    avg: Math.round(vals.reduce((a, b) => a + b, 0) / vals.length)
  })).sort((a, b) => a.avg - b.avg);

  // Alkohol nach Wochentag: welcher Wochentag hat am häufigsten Alkohol-Einträge?
  const alcoholByWeekday = {};
  days.forEach(d => {
    const wd = weekdayOf(d.date);
    if (!alcoholByWeekday[wd]) alcoholByWeekday[wd] = {
      total: 0,
      withAlcohol: 0
    };
    alcoholByWeekday[wd].total++;
    if (alcoholGrams(d.alcohol) > 0) alcoholByWeekday[wd].withAlcohol++;

  const alcoholWeekdayPattern = Object.entries(alcoholByWeekday).filter(([, v]) => v.total >= 2).map(([wd, v]) => ({
    weekday: wd,
    share: v.withAlcohol / v.total,
    total: v.total
  })).filter(x => x.share >= 0.6).sort((a, b) => b.share - a.share);

  // Generische Musteranalyse: erkennt "häufig, aber unauffällig" für die
  // wichtigsten Belastungsfaktoren, unabhängig davon ob ein Einzeltag je
  // als "hoch" markiert wurde.
  const patterns = [];
  if (anyAlcoholShare >= 0.4 && highAlcoholDays === 0) {
    patterns.push({
      key: "alcohol-frequent-mild",
      text: `An ${anyAlcoholDays} von ${days.length} Tagen war Alkohol im Spiel – meist in kleineren Mengen, nie in der höchsten Belastungsstufe. Auch regelmäßiger, geringer Konsum kann sich über die Zeit summieren, selbst wenn kein einzelner Tag auffällt.`
    });
  }
  if (alcoholWeekdayPattern.length > 0) {
    const p = alcoholWeekdayPattern[0];
    const pct = Math.round(p.share * 100);
    patterns.push({
      key: "alcohol-weekday",
      text: `An ${p.weekday}en hattest du in ${pct}% der Fälle Alkohol eingetragen. Das könnte ein wiederkehrendes Muster sein, das dir vielleicht selbst noch nicht aufgefallen war.`
    });
  }

      lineHeight: 1.5
    }
  }, "Diese Erklärungen beschreiben mögliche, allgemein bekannte Zusammenhänge und sind keine medizinische Diagnose oder Beratung."));
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(LevelUpApp));
</script>

<script>
// ==================== PWA INSTALL & iOS DETECTION ====================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const proto = window.location.protocol;
    if (proto !== 'https:' && proto !== 'http:') return;
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isInStandaloneMode = () =>
  ('standalone' in window.navigator && window.navigator.standalone) ||
  window.matchMedia('(display-mode: standalone)').matches;
const isIOSSafari = isIOS && /Safari/.test(navigator.userAgent) && !/CriOS|FxiOS|OPiOS|mercury/.test(navigator.userAgent);

function showIOSBanner() {
  const banner = document.getElementById('ios-install-banner');
  if (banner) {
    banner.classList.remove('levelup-install-btn-hidden');
    banner.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
}
function dismissIOSBanner() {
  const banner = document.getElementById('ios-install-banner');
  if (banner) banner.classList.add('levelup-install-btn-hidden');
}
document.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'ios-banner-dismiss') dismissIOSBanner();
});

let deferredInstallPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const hBtn = document.getElementById('header-install-btn');
  if (hBtn) hBtn.classList.remove('levelup-install-btn-hidden');
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  const hBtn = document.getElementById('header-install-btn');
  if (hBtn) hBtn.classList.add('levelup-install-btn-hidden');
});

function triggerInstall() {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(() => {
      deferredInstallPrompt = null;
    });
  } else if (isInStandaloneMode()) {
    window.alert('App ist bereits installiert ✅');
  } else if (isIOSSafari) {
    showIOSBanner();
  } else {
    window.alert('Dein Browser hat die Installation noch nicht freigegeben. Versuche es über das Browser-Menü → "App installieren" bzw. "Zum Startbildschirm hinzufügen".');
  }
}
document.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'header-install-btn') triggerInstall();
});

function revealInstallButtonWhenReady() {
  const hBtn = document.getElementById('header-install-btn');
  if (!hBtn) {
    setTimeout(revealInstallButtonWhenReady, 100);
    return;
  }
  if (isInStandaloneMode()) {
    hBtn.classList.add('levelup-install-btn-hidden');
  } else {
    hBtn.classList.remove('levelup-install-btn-hidden');
  }
}
revealInstallButtonWhenReady();

// ── Diagnose-Panel: zeigt direkt auf der Seite, was Chrome tatsächlich
//    sieht — ersetzt für uns die Chrome-DevTools, die auf dem Handy nicht
//    zur Verfügung stehen.
async function runDiagnostics() {
  const lines = [];
  const ok = (label) => `✅ ${label}`;
  const bad = (label) => `❌ ${label}`;
  const warn = (label) => `⚠️ ${label}`;

  lines.push(location.protocol === 'https:' ? ok('HTTPS aktiv') : bad('Kein HTTPS: ' + location.protocol));
  lines.push('URL: ' + location.href);

  try {
    const manifestUrl = document.querySelector('link[rel="manifest"]')?.href;
    lines.push('Manifest-URL: ' + (manifestUrl || 'NICHT GEFUNDEN'));
    if (manifestUrl) {
      const res = await fetch(manifestUrl);
      lines.push(res.ok ? ok('Manifest abrufbar (Status ' + res.status + ')') : bad('Manifest Status ' + res.status));
      const contentType = res.headers.get('content-type') || '';
      lines.push('Manifest Content-Type: ' + contentType);
      const json = await res.json();
      lines.push(ok('Manifest ist gültiges JSON'));
      lines.push('  name: ' + json.name);
      lines.push('  start_url: ' + json.start_url);
      lines.push('  scope: ' + json.scope);
      lines.push('  display: ' + json.display);
      lines.push('  icons: ' + (json.icons ? json.icons.length + ' Stück' : 'FEHLT'));
      if (json.icons) {
        for (const icon of json.icons) {
          try {
            const iconUrl = new URL(icon.src, manifestUrl).href;
            const iconRes = await fetch(iconUrl);
            lines.push((iconRes.ok ? '  ✅ ' : '  ❌ ') + icon.src + ' (' + icon.sizes + ', ' + icon.purpose + ') Status ' + iconRes.status);
          } catch (e) {
            lines.push('  ❌ ' + icon.src + ' Fehler: ' + e.message);
          }
        }
      }
    }
  } catch (e) {
    lines.push(bad('Manifest-Fehler: ' + e.message));
  }

  if ('serviceWorker' in navigator) {
    lines.push(ok('Service Worker API verfügbar'));
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) {
        lines.push(ok('Service Worker registriert'));
        lines.push('  scope: ' + reg.scope);
        lines.push('  active: ' + (reg.active ? reg.active.state : 'kein aktiver Worker'));
        lines.push('  controller vorhanden: ' + (navigator.serviceWorker.controller ? 'ja' : 'NEIN'));
      } else {
        lines.push(bad('Kein Service Worker registriert'));
      }
    } catch (e) {
      lines.push(bad('Service Worker Fehler: ' + e.message));
    }
  } else {
    lines.push(bad('Service Worker API nicht verfügbar'));
  }

  lines.push(deferredInstallPrompt ? ok('beforeinstallprompt wurde gefeuert') : warn('beforeinstallprompt noch NICHT gefeuert'));
  lines.push('Bereits installiert (standalone): ' + (isInStandaloneMode() ? 'ja' : 'nein'));
  lines.push('User Agent: ' + navigator.userAgent);
  lines.push('window.chrome vorhanden: ' + (typeof window.chrome !== 'undefined'));
  lines.push('navigator.getInstalledRelatedApps vorhanden: ' + (typeof navigator.getInstalledRelatedApps !== 'undefined'));

  const el = document.getElementById('diag-content');
  const container = document.getElementById('pwa-diagnostics');
  const titleEl = container ? container.firstElementChild : null;
  if (el) el.innerHTML = lines.map(l => l.replace(/</g, '&lt;')).join('<br>');
  if (titleEl) titleEl.textContent = '🔧 PWA-Diagnose (fertig)';
}
setTimeout(runDiagnostics, 1500);
</script>
</body>
</html>
